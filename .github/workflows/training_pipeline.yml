name: Training Pipeline

on:
  schedule:
    - cron: "30 1 * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    name: Daily AQI Model Training
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      APP_ENV: production
      CITY: Lahore
      LATITUDE: "31.5204"
      LONGITUDE: "74.3587"
      TIMEZONE: Asia/Karachi
      HTTP_TIMEOUT_SECONDS: "90"

      REDIS_CONNECTION_STRING: ${{ secrets.REDIS_CONNECTION_STRING }}

      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate training secrets
        run: |
          test -n "$REDIS_CONNECTION_STRING"
          test -n "$MLFLOW_TRACKING_URI"
          test -n "$MLFLOW_TRACKING_USERNAME"
          test -n "$MLFLOW_TRACKING_PASSWORD"
          echo "Required training secrets are available"

      - name: Run daily training pipeline
        run: |
          python -m app.training_pipeline.daily_pipeline

      - name: Upload training reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: aqi-training-reports
          path: |
            reports/model_benchmarks/
            artifacts/models/
          if-no-files-found: warn