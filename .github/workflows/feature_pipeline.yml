name: Feature Pipeline

on:
  schedule:
    - cron: "5 * * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-features:
    name: Hourly AQI Feature Update
    runs-on: ubuntu-latest

    env:
      APP_ENV: production
      CITY: Lahore
      LATITUDE: "31.5204"
      LONGITUDE: "74.3587"
      TIMEZONE: Asia/Karachi
      HTTP_TIMEOUT_SECONDS: "30"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Redis configuration
        env:
          REDIS_CONNECTION_STRING: ${{ secrets.REDIS_CONNECTION_STRING }}
        run: |
          if [ -z "$REDIS_CONNECTION_STRING" ]; then
            echo "REDIS_CONNECTION_STRING secret is missing or empty"
            exit 1
          fi

          echo "Redis configuration is available"

      - name: Apply Feast definitions
        working-directory: feature_repo
        env:
          REDIS_CONNECTION_STRING: ${{ secrets.REDIS_CONNECTION_STRING }}
        run: |
          feast apply

      - name: Run hourly live feature pipeline
        env:
          REDIS_CONNECTION_STRING: ${{ secrets.REDIS_CONNECTION_STRING }}
        run: |
          python -m app.feature_pipeline.live_pipeline