name: Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.13 Test Suite
    runs-on: ubuntu-latest

    env:
      APP_ENV: development
      CITY: Lahore
      LATITUDE: "31.5204"
      LONGITUDE: "74.3587"
      TIMEZONE: Asia/Karachi
      HTTP_TIMEOUT_SECONDS: "15"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Show environment
        run: |
          python --version
          pip --version

      - name: Run test suite
        run: |
          pytest -v -p no:cacheprovider
